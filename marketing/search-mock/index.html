<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>handmade ceramic mugs - Image search</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.4 Arial,"Helvetica Neue",Helvetica,sans-serif;color:#1f1f1f;background:#fff}
  header{display:flex;align-items:center;gap:28px;padding:20px 28px 6px 28px}
  .brand{display:flex;align-items:center;gap:8px;min-width:120px;color:#5f6368;font:500 20px/1 Arial,sans-serif;letter-spacing:-.01em}
  .brand svg{width:26px;height:26px}
  .q{flex:0 1 690px;display:flex;align-items:center;height:46px;border-radius:24px;box-shadow:0 1px 6px rgba(32,33,36,.28);padding:0 8px 0 20px;gap:12px}
  .q input{flex:1;border:0;outline:0;font:16px Arial,sans-serif;color:#1f1f1f}
  .q .ic{width:24px;height:24px;color:#5f6368;display:grid;place-items:center}
  .q .sep{width:1px;height:28px;background:#dadce0}
  .q svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
  .right{margin-left:auto;display:flex;align-items:center;gap:18px}
  .apps{width:24px;height:24px;display:grid;grid-template-columns:repeat(3,5px);gap:3.5px;align-content:center;justify-content:center}
  .apps i{width:5px;height:5px;border-radius:50%;background:#5f6368}
  .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#e07a5f,#f2cc8f);color:#fff;display:grid;place-items:center;font-weight:700}
  nav{display:flex;gap:4px;padding:6px 0 0 176px;border-bottom:1px solid #ebebeb}
  nav a{padding:10px 12px 12px;color:#5f6368;text-decoration:none;font-size:14px;border-bottom:3px solid transparent}
  nav a.on{color:#1f1f1f;border-color:#1f1f1f;font-weight:500}
  nav .tools{margin-left:auto;margin-right:28px}
  .chips{display:flex;gap:8px;padding:14px 28px 14px 176px;overflow:hidden;white-space:nowrap}
  .chip{display:inline-flex;align-items:center;gap:8px;height:36px;border-radius:8px;background:#f0f4f9;padding:0 14px 0 4px;color:#1f1f1f;font-size:14px;flex:none}
  .chip img{width:28px;height:28px;border-radius:6px;object-fit:cover}
  .chip.plain{padding:0 14px;border:1px solid #c7c7c7;background:#fff}
  main{padding:4px 28px 40px 28px}
  .row{display:flex;gap:12px;margin-bottom:22px}
  .tile{min-width:0}
  .tile img{display:block;width:100%;border-radius:12px;background:#f1f3f4}
  .src{display:flex;align-items:center;gap:6px;margin-top:8px;color:#4d5156;font-size:12px;white-space:nowrap;overflow:hidden}
  .src i{width:16px;height:16px;border-radius:50%;flex:none}
  .t{color:#1f1f1f;font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<header>
  <div class="brand"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6.5" fill="none" stroke="#5f6368" stroke-width="2.4"/><path d="M15 15l5.5 5.5" stroke="#5f6368" stroke-width="2.6" stroke-linecap="round"/></svg>Images</div>
  <div class="q">
    <input value="handmade ceramic mugs" aria-label="Search">
    <span class="ic"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></span><span class="sep"></span>
    <span class="ic"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span>
    <span class="ic"><svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><circle cx="12" cy="12" r="3"/></svg></span>
    <span class="ic" style="color:#1a73e8"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg></span>
  </div>
  <div class="right"><span class="apps"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><span class="avatar">S</span></div>
</header>
<nav><a>All</a><a class="on">Images</a><a>Shopping</a><a>Videos</a><a>News</a><a>Short videos</a><a>More</a><a class="tools">Tools</a></nav>
<div class="chips" id="chips"></div>
<main id="grid"></main>
<script>
const sites=[['claystudio.co','#e07a5f'],['kilnandco.com','#3d5a80'],['lumenhome.shop','#e76f51'],['potterydaily.blog','#81b29a'],['makermarket.com','#f2cc8f'],['nordicclay.com','#457b9d'],['slowmornings.studio','#b56576'],['wheelthrown.net','#6d597a'],['homeandhearth.co','#2a9d8f'],['glazeguide.org','#d4a373']];
const titles={mug:['Speckled stoneware mug','Handmade coffee mug, 12 oz','Wheel-thrown mug with handle','Matte glaze ceramic mug','Hand-painted pottery mug','Rustic latte mug'],
  bowl:['Handmade ramen bowl','Stoneware serving bowl','Ceramic noodle bowl, glazed'],vase:['Bud vase, hand-thrown','Minimal ceramic vase'],
  plate:['Handmade dinner plate','Stoneware side plate'],set:['Set of 3 handmade mugs','Mug gift set, assorted glazes']};
fetch('img/meta.json').then(r=>r.json()).then(meta=>{
  const chips=[['Handmade',3],['Speckled',7],['Large',12],['Blue',2],['Set of 4',9],['Rustic',15],['Japanese',20],['With saucer',25],['Personalized',5]];
  document.getElementById('chips').innerHTML=chips.map(([t,i])=>`<span class="chip"><img src="img/r${String(i).padStart(2,'0')}.svg" alt="">${t}</span>`).join('')+'<span class="chip plain">Etc</span>';
  const W=document.getElementById('grid').clientWidth, H=190, gap=12;
  let row=[],html='';
  const flush=(last)=>{const sum=row.reduce((s,m)=>s+m[1]/m[2],0);const h=last?H:(W-gap*(row.length-1))/sum;
    html+='<div class="row">'+row.map(([i,w,hh,k])=>{const [site,col]=sites[i%sites.length];const t=titles[k][i%titles[k].length];
      return `<div class="tile" style="width:${(w/hh*h).toFixed(1)}px"><img src="img/r${String(i).padStart(2,'0')}.svg" style="height:${h.toFixed(1)}px;object-fit:cover" alt="${t}"><div class="src"><i style="background:${col}"></i>${site}</div><div class="t">${t}</div></div>`}).join('')+'</div>';row=[]};
  for(const m of meta){row.push(m);const sum=row.reduce((s,x)=>s+x[1]/x[2],0);if(sum*H+gap*(row.length-1)>=W)flush(false)}
  if(row.length)flush(true);
  document.getElementById('grid').innerHTML=html;
});
</script>
</body>
</html>
